<title id="fig2-title">Pilot flow from 29 purposively selected papers to 6 primary-pair eligible papers</title>
<desc id="fig2-desc">Flow diagram: 29 papers in the purposive frame, 27 accessible, 12 coded, 8 eligible for all pairs, and 6 eligible for the two primary pairs.</desc>
