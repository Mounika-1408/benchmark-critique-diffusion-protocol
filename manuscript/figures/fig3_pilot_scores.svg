<text x="80" y="217.0" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8c97a3">50%</text>
<line x1="90" y1="145.5" x2="720" y2="145.5" stroke="#e1e7ed" stroke-width="1"/>
<text x="80" y="149.5" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8c97a3">75%</text>
<line x1="90" y1="78.0" x2="720" y2="78.0" stroke="#e1e7ed" stroke-width="1"/>
<text x="80" y="82.0" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8c97a3">100%</text>
