<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="fig2-title fig2-desc">
<title id="fig2-title">Pilot adoption-score distribution for primary pairs and all pairs</title>
<desc id="fig2-desc">Stacked bars: primary-pair papers have one full, three acknowledged, two citation-only, and no partial adopters. All-pair papers add one acknowledged and one citation-only GSM1k case.</desc>
<rect width="760" height="430" fill="white"/>
<text x="90" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1d2733">Pilot adoption-score distribution</text>
<text x="90" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8c97a3">Counts are tiny; bars are descriptive, not prevalence estimates.</text>
<line x1="90" y1="348.0" x2="720" y2="348.0" stroke="#e1e7ed" stroke-width="1"/>
